version: "3.9"

# Omni-Modal Enterprise Research Orchestrator — local Docker Compose
# Starts the Python API backend. The frontend (Next.js) should be run
# separately with `npm run dev` until a production build is configured.
#
# Usage:
#   docker compose up --build
#
# The backend will be available at http://localhost:8000

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      # Mount uploads to a local directory so files survive container restarts
      - omni_uploads:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  omni_uploads:
