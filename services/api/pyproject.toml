[project]
name = "omni-modal-api"
version = "0.1.0"
description = "Python orchestration backend for Omni-Modal Enterprise Research Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
audio = [
    "openai-whisper>=20250625",
]

db = [
    "psycopg[binary]>=3.2.0",
]

ml = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0; platform_system != 'Windows'",
    "peft>=0.12.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
]

observability = ["sentry-sdk>=2.0.0"]

performance = [
    "psycopg-pool>=3.2.0",
    "cachetools>=5.3.0",
]

test = [
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
omni-entities = "omni_modal.entity_extraction.cli:main"
omni-mcp = "omni_modal.mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
